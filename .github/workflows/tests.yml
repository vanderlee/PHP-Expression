name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php-version == '8.6' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.1'
            composer: '2.2'
          - php-version: '7.4'
            composer: 'v2'
          - php-version: '8.0'
            composer: 'v2'
          - php-version: '8.1'
            composer: 'v2'
          - php-version: '8.2'
            composer: 'v2'
          - php-version: '8.3'
            composer: 'v2'
          - php-version: '8.4'
            composer: 'v2'
          - php-version: '8.5'
            composer: 'v2'
          - php-version: '8.6'
            composer: 'v2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:${{ matrix.composer }}

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: composer test
